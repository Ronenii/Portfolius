<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; gap: 14px; justify-content: center; flex-direction: row; align-items: flex-end; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 76px; height: 56px; background: var(--accent-500); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); text-align: center; line-height: 1.4; }
  .lbl b { color: var(--fg-paper); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="stack"><div class="box" style="border-radius: 0;"></div><div class="lbl"><b>0</b><br>tables, dividers</div></div>
  <div class="stack"><div class="box" style="border-radius: 2px;"></div><div class="lbl"><b>xs · 2</b><br>chips, badges</div></div>
  <div class="stack"><div class="box" style="border-radius: 4px;"></div><div class="lbl"><b>sm · 4</b><br>small ui</div></div>
  <div class="stack"><div class="box" style="border-radius: 6px;"></div><div class="lbl"><b>md · 6</b><br>default — buttons, cards</div></div>
  <div class="stack"><div class="box" style="border-radius: 10px;"></div><div class="lbl"><b>lg · 10</b><br>large surfaces</div></div>
  <div class="stack"><div class="box" style="border-radius: 999px; width: 56px;"></div><div class="lbl"><b>full</b><br>filter pills</div></div>
</div>
</body></html>
