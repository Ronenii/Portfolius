<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark (terminal)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { justify-content: center; gap: 6px; background: var(--ink-950); color: var(--fg-terminal); }
  .mark { display: flex; align-items: baseline; gap: 3px; font-family: var(--font-display); font-weight: 400; font-size: 64px; color: var(--fg-terminal); letter-spacing: -0.02em; line-height: 1; }
  .mark .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-300); margin-bottom: 3px; }
  .tagline { font-family: var(--font-mono); font-size: 11px; color: var(--ink-300); letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body class="dark">
<div class="card dark">
  <div class="mark">portfolius<span class="dot"></span></div>
  <div class="tagline">// terminal mode · 2026.05.27</div>
</div>
</body></html>
