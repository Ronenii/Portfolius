<!doctype html>
<html><head><meta charset="utf-8"><title>Glyph lockups</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { justify-content: center; flex-direction: row; gap: 32px; align-items: center; }
  .lockup { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  .glyph { width: 56px; height: 56px; display: flex; align-items: baseline; justify-content: center; font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1; padding-bottom: 10px; }
  .glyph .p { letter-spacing: -1px; }
  .glyph .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 2px; transform: translateY(-2px); }

  .glyph.outline { border-radius: 50%; border: 1.5px solid var(--accent-500); background: var(--paper-50); color: var(--fg-paper); }
  .glyph.outline .dot { background: var(--accent-500); }
  .glyph.solid { border-radius: 12px; background: var(--accent-500); color: var(--paper-50); }
  .glyph.solid .dot { background: var(--paper-50); }
  .glyph.coin { border-radius: 50%; background: var(--accent-500); color: var(--paper-50); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,0.18); }
  .glyph.coin .dot { background: var(--paper-50); }

  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); letter-spacing: 0.04em; }

  .wordmark-row { display: flex; align-items: baseline; gap: 3px; font-family: var(--font-display); font-size: 32px; line-height: 1; letter-spacing: -0.02em; }
  .wordmark-row .dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-500); margin-bottom: 1px; }
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <div class="glyph outline"><span class="p">p</span><span class="dot"></span></div>
    <div class="lbl">outline</div>
  </div>
  <div class="lockup">
    <div class="glyph solid"><span class="p">p</span><span class="dot"></span></div>
    <div class="lbl">solid · app icon</div>
  </div>
  <div class="lockup">
    <div class="glyph coin"><span class="p">p</span><span class="dot"></span></div>
    <div class="lbl">coin · favicon</div>
  </div>
  <div style="border-left: 1px solid var(--rule); height: 80px; margin: 0 8px;"></div>
  <div class="lockup">
    <div class="wordmark-row">portfolius<span class="dot"></span></div>
    <div class="lbl">wordmark · 32px</div>
  </div>
</div>
</body></html>
