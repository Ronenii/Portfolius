<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { justify-content: center; gap: 6px; }
  .mark { display: flex; align-items: baseline; gap: 3px; font-family: var(--font-display); font-weight: 400; font-size: 64px; color: var(--fg-paper); letter-spacing: -0.02em; line-height: 1; }
  .mark .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-500); margin-bottom: 3px; }
  .tagline { font-family: var(--font-sans); font-size: 12px; color: var(--ink-500); letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">portfolius<span class="dot"></span></div>
  <div class="tagline">Long-term investing dashboard</div>
</div>
</body></html>
