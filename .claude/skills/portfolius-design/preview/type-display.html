<!doctype html>
<html><head><meta charset="utf-8"><title>Display serif</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; gap: 8px; justify-content: center; }
  .sample { font-family: var(--font-display); font-weight: 400; color: var(--fg-paper); line-height: 1.02; letter-spacing: -0.02em; font-size: 68px; }
  .sample em { font-style: italic; color: var(--accent-700); }
  .meta { display: flex; gap: 18px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); }
  .meta b { color: var(--fg-paper); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="sample">Hold it. <em>Slowly.</em></div>
  <div class="meta"><span><b>Instrument Serif</b> · 400 · italic</span><span>display headlines, wordmark</span><span>tracking -0.02em</span></div>
</div>
</body></html>
