<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; gap: 14px; justify-content: center; }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  label { font-family: var(--font-sans); font-size: 11px; font-weight: 500; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.08em; }
  input, select { font-family: var(--font-sans); font-size: 14px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper-50); color: var(--fg-paper); outline: none; transition: border-color 120ms, box-shadow 120ms; }
  input:focus, select:focus { border-color: var(--accent-500); box-shadow: 0 0 0 3px rgba(168, 123, 44, 0.18); }
  input.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  input.err { border-color: var(--loss-500); }
  .help { font-family: var(--font-sans); font-size: 11px; color: var(--ink-500); }
  .help.err { color: var(--loss-500); }
  .with-prefix { position: relative; }
  .with-prefix::before { content: "$"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); color: var(--ink-500); font-size: 14px; pointer-events: none; }
  .with-prefix input { padding-left: 22px; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="field"><label>Ticker</label><input type="text" value="VTI" style="font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase;"></div>
    <div class="field"><label>Quantity</label><input class="num" type="text" value="8,124"></div>
    <div class="field"><label>Average cost</label><div class="with-prefix"><input class="num" type="text" value="208.42"></div></div>
    <div class="field"><label>Base currency</label><select><option>USD</option><option>EUR</option></select></div>
  </div>
  <div class="row">
    <div class="field"><label>Goal</label><input type="text" value="" placeholder="e.g. early retirement at 55"></div>
    <div class="field" style="flex: 0 0 220px;"><label>Time horizon</label><input class="num err" type="text" value="2"><span class="help err">Must be at least 3 years.</span></div>
  </div>
</div>
</body></html>
