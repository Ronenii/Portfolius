<!doctype html>
<html><head><meta charset="utf-8"><title>Card · paper</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; gap: 14px; flex-direction: row; align-items: stretch; }
  .demo { background: var(--paper-100); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .demo.kpi { border-top: 2px solid var(--accent-500); }
  .demo.chart { border: none; box-shadow: 0 1px 2px rgba(20,18,12,0.06); background: var(--paper-50); }
  .eyebrow { font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-500); font-weight: 500; }
  .title { font-family: var(--font-display); font-size: 22px; color: var(--fg-paper); line-height: 1.1; }
  .big { font-family: var(--font-mono); font-size: 28px; font-weight: 500; color: var(--fg-paper); letter-spacing: -0.01em; }
  .delta { font-family: var(--font-mono); font-size: 12px; color: var(--gain-500); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="demo">
    <div class="eyebrow">default card</div>
    <div class="title">By region</div>
    <div style="font-family: var(--font-sans); font-size: 12px; color: var(--ink-500);">5 markets · daily close</div>
    <div class="lbl">border + radius 6 · shadow-0</div>
  </div>
  <div class="demo kpi">
    <div class="eyebrow">primary KPI</div>
    <div class="big">$363,634</div>
    <div class="delta">↑ $2,418 today · 0.67%</div>
    <div class="lbl">brass top rule · border + shadow-0</div>
  </div>
  <div class="demo chart">
    <div class="eyebrow">chart card</div>
    <div class="title">12-month value</div>
    <div style="height: 24px; background: linear-gradient(180deg, transparent 60%, var(--accent-100) 60%); border-radius: 2px;"></div>
    <div class="lbl">no border · shadow-1</div>
  </div>
</div>
</body></html>
