name: Refresh Prices

on:
  schedule:
    - cron: "30 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh portfolio prices
        run: |
          curl --fail-with-body \
            --request POST \
            --header "X-Scheduler-Secret: $PORTFOLIUS_SCHEDULER_SECRET" \
            "$PORTFOLIUS_API_URL/api/v1/jobs/refresh-prices"
        env:
          PORTFOLIUS_API_URL: ${{ secrets.PORTFOLIUS_API_URL }}
          PORTFOLIUS_SCHEDULER_SECRET: ${{ secrets.PORTFOLIUS_SCHEDULER_SECRET }}
