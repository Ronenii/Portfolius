services:
  - type: web
    name: portfolius-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e ".[dev]"
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
