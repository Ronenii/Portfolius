services:
  - type: web
    name: portfolius-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -e ".[dev]"
    # NOTE: preDeployCommand is ignored on Render's free plan, so migrations
    # are run from startCommand instead. `alembic upgrade head` is idempotent.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: FRONTEND_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHON_VERSION
        value: "3.11.0"
