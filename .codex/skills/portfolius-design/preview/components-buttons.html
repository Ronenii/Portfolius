<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; gap: 14px; justify-content: center; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { font-family: var(--font-sans); font-size: 13px; font-weight: 500; border-radius: 6px; padding: 8px 14px; cursor: pointer; transition: all 120ms cubic-bezier(0.2, 0, 0, 1); display: inline-flex; align-items: center; gap: 6px; }
  .b-primary { background: var(--accent-500); color: var(--paper-50); border: 1px solid var(--accent-500); }
  .b-primary:hover { background: var(--accent-700); border-color: var(--accent-700); }
  .b-secondary { background: var(--paper-50); color: var(--fg-paper); border: 1px solid var(--rule); }
  .b-secondary:hover { background: var(--paper-200); }
  .b-ghost { background: transparent; color: var(--fg-paper); border: 1px solid transparent; }
  .b-ghost:hover { background: var(--paper-200); }
  .b-link { background: transparent; color: var(--accent-700); border: none; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .b-danger { background: var(--paper-50); color: var(--loss-500); border: 1px solid var(--loss-300); }
  .b-disabled { background: var(--accent-500); color: var(--paper-50); border: 1px solid var(--accent-500); opacity: 0.4; cursor: not-allowed; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--ink-500); width: 64px; flex: none; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><span class="label">default</span>
    <button class="b-primary">Add holding</button>
    <button class="b-secondary">Cancel</button>
    <button class="b-ghost">Skip</button>
    <button class="b-link">View details ↗</button>
    <button class="b-danger">Delete</button>
    <button class="b-disabled">Add holding</button>
  </div>
  <div class="row"><span class="label">sizes</span>
    <button class="b-primary" style="padding: 10px 18px; font-size: 14px;">Save profile</button>
    <button class="b-primary">Add holding</button>
    <button class="b-primary" style="padding: 5px 10px; font-size: 12px;">Edit</button>
  </div>
</div>
</body></html>
