<!doctype html>
<html><head><meta charset="utf-8"><title>Voice</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 16px 24px; gap: 10px; justify-content: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .hd { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; }
  .yes { color: var(--gain-500); }
  .no { color: var(--loss-500); }
  .ex { font-family: var(--font-display); font-size: 18px; line-height: 1.3; color: var(--fg-paper); }
  .ex em { font-style: italic; color: var(--accent-700); }
  .strike { color: var(--ink-300); text-decoration: line-through; font-style: italic; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="col">
      <div class="hd yes">▸ portfolius writes</div>
      <div class="ex">Daily-close prices fetched automatically.</div>
      <div class="ex">Target cost: <em>$0/month.</em></div>
      <div class="ex">The assistant cannot place trades.</div>
    </div>
    <div class="col">
      <div class="hd no">▸ portfolius does not</div>
      <div class="ex strike">We've supercharged your portfolio with AI! 🚀</div>
      <div class="ex strike">Real-time market data, beautifully designed.</div>
      <div class="ex strike">Our intelligent advisor recommends...</div>
    </div>
  </div>
</div>
</body></html>
