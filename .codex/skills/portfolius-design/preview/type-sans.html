<!doctype html>
<html><head><meta charset="utf-8"><title>UI sans</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; gap: 6px; justify-content: center; }
  .row-sample { display: flex; align-items: baseline; gap: 16px; font-family: var(--font-sans); color: var(--fg-paper); }
  .row-sample .w { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); min-width: 36px; }
  .meta { display: flex; gap: 16px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); margin-top: 4px; }
  .meta b { color: var(--fg-paper); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="row-sample"><span class="w">300</span><span style="font-size: 20px; font-weight: 300;">Long-term investing</span></div>
  <div class="row-sample"><span class="w">400</span><span style="font-size: 20px; font-weight: 400;">Long-term investing</span></div>
  <div class="row-sample"><span class="w">500</span><span style="font-size: 20px; font-weight: 500;">Long-term investing</span></div>
  <div class="row-sample"><span class="w">600</span><span style="font-size: 20px; font-weight: 600;">Long-term investing</span></div>
  <div class="row-sample"><span class="w">700</span><span style="font-size: 20px; font-weight: 700;">Long-term investing</span></div>
  <div class="meta"><span><b>Geist</b> · 300–700</span><span>UI text, buttons, labels, body</span></div>
</div>
</body></html>
