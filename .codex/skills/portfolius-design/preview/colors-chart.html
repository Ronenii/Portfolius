<!doctype html>
<html><head><meta charset="utf-8"><title>Chart palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; gap: 12px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); }
  .dot { width: 12px; height: 12px; border-radius: 2px; }
  .legend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; }
  .bar { display: flex; height: 28px; border-radius: 4px; overflow: hidden; }
  .seg { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.92); }
  .title { font-family: var(--font-sans); font-size: 11px; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="title">Allocation · by region</div>
  <div class="bar">
    <div class="seg" style="background: #1F6B6E; flex: 42;">US 42%</div>
    <div class="seg" style="background: #4F7A4A; flex: 22;">EU 22%</div>
    <div class="seg" style="background: #4A6E8C; flex: 14;">APAC 14%</div>
    <div class="seg" style="background: #71A8AB; flex: 12; color: #0A2D30;">EM 12%</div>
    <div class="seg" style="background: #6E6757; flex: 10;">Other</div>
  </div>
  <div class="legend-grid">
    <div class="legend-row"><span class="dot" style="background: #1F6B6E;"></span>chart-1 accent (teal)</div>
    <div class="legend-row"><span class="dot" style="background: #4F7A4A;"></span>chart-2 gain</div>
    <div class="legend-row"><span class="dot" style="background: #4A6E8C;"></span>chart-3 info</div>
    <div class="legend-row"><span class="dot" style="background: #A8442C;"></span>chart-4 loss</div>
    <div class="legend-row"><span class="dot" style="background: #6E6757;"></span>chart-5 ink</div>
    <div class="legend-row"><span class="dot" style="background: #A87B2C;"></span>chart-6 brass (2nd)</div>
    <div class="legend-row"><span class="dot" style="background: #71A8AB;"></span>chart-7 accent-300</div>
    <div class="legend-row"><span class="dot" style="background: #92B58E;"></span>chart-8 gain-300</div>
  </div>
</div>
</body></html>
