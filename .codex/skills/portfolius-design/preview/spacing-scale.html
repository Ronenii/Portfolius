<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; gap: 8px; justify-content: center; }
  .row { display: flex; align-items: center; gap: 16px; }
  .num { font-family: var(--font-mono); font-size: 10px; color: var(--ink-500); width: 96px; flex: none; }
  .bar { background: var(--accent-500); height: 12px; border-radius: 2px; }
  .name b { color: var(--fg-paper); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><span class="num"><b>space-1</b> · 4</span><div class="bar" style="width: 4px;"></div></div>
  <div class="row"><span class="num"><b>space-2</b> · 8</span><div class="bar" style="width: 8px;"></div></div>
  <div class="row"><span class="num"><b>space-3</b> · 12</span><div class="bar" style="width: 12px;"></div></div>
  <div class="row"><span class="num"><b>space-4</b> · 16</span><div class="bar" style="width: 16px;"></div></div>
  <div class="row"><span class="num"><b>space-5</b> · 20</span><div class="bar" style="width: 20px;"></div></div>
  <div class="row"><span class="num"><b>space-6</b> · 24</span><div class="bar" style="width: 24px;"></div></div>
  <div class="row"><span class="num"><b>space-7</b> · 32</span><div class="bar" style="width: 32px;"></div></div>
  <div class="row"><span class="num"><b>space-8</b> · 40</span><div class="bar" style="width: 40px;"></div></div>
  <div class="row"><span class="num"><b>space-9</b> · 56</span><div class="bar" style="width: 56px;"></div></div>
  <div class="row"><span class="num"><b>space-10</b> · 72</span><div class="bar" style="width: 72px;"></div></div>
  <div class="row"><span class="num"><b>space-11</b> · 96</span><div class="bar" style="width: 96px;"></div></div>
</div>
</body></html>
