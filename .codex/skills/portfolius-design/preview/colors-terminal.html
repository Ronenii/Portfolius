<!doctype html>
<html><head><meta charset="utf-8"><title>Terminal surfaces</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--ink-950); }
  .card { padding: 20px 24px; gap: 12px; background: var(--ink-950); color: var(--fg-terminal); }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { padding: 14px; border-radius: 6px; border: 1px solid var(--ink-800); min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .sw .name { font-size: 12px; font-weight: 500; color: var(--fg-terminal); }
  .sw .hex { font-family: var(--font-mono); font-size: 10px; color: var(--ink-300); }
  .sw .role { font-size: 10px; color: var(--ink-300); font-style: italic; }
</style>
</head>
<body class="dark">
<div class="card dark">
  <div class="swatches">
    <div class="sw" style="background: #0E1217;"><div><div class="name">ink-950</div><div class="role">terminal bg</div></div><div class="hex">#0E1217</div></div>
    <div class="sw" style="background: #161B22;"><div><div class="name">ink-900</div><div class="role">cards</div></div><div class="hex">#161B22</div></div>
    <div class="sw" style="background: #222831;"><div><div class="name">ink-800</div><div class="role">hairline</div></div><div class="hex">#222831</div></div>
    <div class="sw" style="background: #3B362B;"><div><div class="name">ink-700</div><div class="role">paper-mode heavy</div></div><div class="hex">#3B362B</div></div>
  </div>
</div>
</body></html>
